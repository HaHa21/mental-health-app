<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Sign In</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Mental Health App</ion-card-title>
        <ion-card-subtitle>Sign in to your account</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>

        <ion-item>
          <ion-label position="floating">Email</ion-label>
          <ion-input type="email" formControlName="email" autocomplete="email"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Password</ion-label>
          <ion-input type="password" formControlName="password" autocomplete="current-password"></ion-input>
        </ion-item>

        <ion-text color="danger" *ngIf="error">
          <p>{{ error }}</p>
        </ion-text>

        <ion-button expand="block" type="submit" [disabled]="form.invalid || loading" class="ion-margin-top">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Sign In</span>
        </ion-button>

        <ion-button expand="block" fill="clear" routerLink="/register">
          Create an account
        </ion-button>

      </ion-card-content>
    </ion-card>
  </form>
</ion-content>
