<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Create Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Register</ion-card-title>
      </ion-card-header>
      <ion-card-content>

        <ion-item>
          <ion-label position="floating">Full Name</ion-label>
          <ion-input type="text" formControlName="fullName"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Email</ion-label>
          <ion-input type="email" formControlName="email" autocomplete="email"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Password (min 8 chars)</ion-label>
          <ion-input type="password" formControlName="password"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label>Role</ion-label>
          <ion-select formControlName="role" interface="action-sheet">
            <ion-select-option value="PUBLIC">Public</ion-select-option>
            <ion-select-option value="PROFESSIONAL">Healthcare Professional</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-text color="danger" *ngIf="error">
          <p>{{ error }}</p>
        </ion-text>

        <ion-button expand="block" type="submit" [disabled]="form.invalid || loading" class="ion-margin-top">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">Register</span>
        </ion-button>

        <ion-button expand="block" fill="clear" routerLink="/login">
          Already have an account? Sign in
        </ion-button>

      </ion-card-content>
    </ion-card>
  </form>
</ion-content>
